name: 'Full CI/CD: Azure Smart Staffing RAG'

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: '1. Detectar Alterações'
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      search: ${{ steps.filter.outputs.search }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            k8s: ['k8s/**']
            search: ['search_assets/**', 'scripts/sync_search.py']

  terraform:
    name: '2. Infraestrutura'
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true' || github.run_number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="prefix=${{ secrets.PREFIX }}"

  deploy-functions:
    name: '3. Deploy: Azure Functions'
    needs: [terraform, changes]
    # SEMPRE executa, desde que o terraform não tenha falhado (pode ter sido skipped)
    if: always() && !contains(needs.terraform.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Wait for Azure Propagation'
        run: sleep 30

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Discover Real Function Name'
        id: discover
        run: |
          RG="rg-${{ secrets.PREFIX }}-prod"
          # Captura o nome real que está na Azure agora (func-enrich-data-staffrag)
          REAL_NAME=$(az functionapp list -g $RG --query "[0].name" -o tsv)
          echo "nome_da_funcao=$REAL_NAME" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 'Deploy Function Code'
        uses: Azure/functions-action@v1
        with:
          # Usa o output do step de descoberta acima
          app-name: ${{ steps.discover.outputs.nome_da_funcao }}
          package: './azure_functions/geocoding'

  setup-env:
    name: '4. Auto-Discovery & Secrets'
    needs: [terraform]
    # Essencial para os jobs seguintes, roda se o terraform deu bom ou foi pulado
    if: always() && !contains(needs.terraform.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      acrserver: ${{ steps.get_data.outputs.acrserver }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: 'Wait for Services Ready'
        run: sleep 40
      
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Get Resources Data
        id: get_data
        run: |
          cd terraform
          terraform init
          
          # 1. Captura os outputs com segurança
          MSI_ID=$(terraform output -raw managed_identity_client_id)
          OPENAI_ENDPOINT=$(terraform output -raw azure_openai_endpoint)
          SEARCH_ENDPOINT=$(terraform output -raw azure_search_endpoint)
          ACR_SERVER=$(terraform output -raw acr_login_server)
          ST_NAME=$(terraform output -raw storage_account_name)
          FUNC_NAME=$(terraform output -raw function_app_name)
          RG="rg-${{ secrets.PREFIX }}-prod"

          # 2. Captura as Chaves usando as variáveis acima
          # Adicionei o --name e --resource-group de forma explícita e simples
          OPENAI_KEY=$(az cognitiveservices account keys list --name $(az cognitiveservices account list -g $RG --query "[0].name" -o tsv) --resource-group $RG --query "key1" -o tsv)
          ST_CONN=$(az storage account show-connection-string --name "$ST_NAME" --resource-group "$RG" --query "connectionString" -o tsv)
          FUNC_KEY=$(az functionapp keys list --name "$FUNC_NAME" --resource-group "$RG" --query "masterKey" -o tsv)
          FUNC_URL="https://$FUNC_NAME.azurewebsites.net/api/geocoding"

          # 3. Escrita no arquivo (Voltando um nível para a raiz)
          echo "OPENAI_ENDPOINT=$OPENAI_ENDPOINT" > ../azure.env
          echo "SEARCH_ENDPOINT=$SEARCH_ENDPOINT" >> ../azure.env
          echo "AZURE_OPENAI_API_KEY=$OPENAI_KEY" >> ../azure.env
          echo "AZURE_CLIENT_ID=$MSI_ID" >> ../azure.env
          echo "ACR_SERVER=$ACR_SERVER" >> ../azure.env
          echo "AZURE_STORAGE_CONNECTION_STRING=$ST_CONN" >> ../azure.env
          echo "GEO_FUNCTION_URL=$FUNC_URL" >> ../azure.env
          echo "GEO_FUNCTION_KEY=$FUNC_KEY" >> ../azure.env
          
          echo "acrserver=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Upload das Variáveis
        uses: actions/upload-artifact@v4
        with:
          name: azure-vars
          path: azure.env
          retention-days: 1

  ai-search-sync:
    name: '5. AI Search: Sync Pipeline'
    needs: [setup-env, changes, deploy-functions]
    # só roda se mudar a pasta search ou for run #1
    if: needs.setup-env.result == 'success' && (needs.changes.outputs.search == 'true' || github.run_number == 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Sync Search Assets
        run: |
          # Carrega as variáveis do arquivo gerado no Job 3
          set -a
          source azure.env
          set +a
          
          pip install azure-search-documents azure-identity requests
          python scripts/sync_search.py

  ci-qa-build:
    name: '6. CI: QA & Docker Build'
    needs: [setup-env]
    # SEMPRE executa para garantir que a imagem no ACR está atualizada com o código
    if: always() && needs.setup-env.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências de Teste
        run: |
          pip install pytest pytest-asyncio httpx -r requirements.txt
          

      - name: Executar Testes Unitários
        env:
          # Variáveis fictícias apenas para o Pydantic/FastAPI inicializar nos testes
          AZURE_SEARCH_ENDPOINT: "https://dummy.search.windows.net"
          AZURE_OPENAI_ENDPOINT: "https://dummy.openai.azure.com"
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dummykey;EndpointSuffix=core.windows.net"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest app/tests/

      - name: Azure Login
        if: success() # Só loga na Azure se os testes passarem
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push
        if: success()
        run: |
          source azure.env
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_SERVER/smart-staffing-api:latest" .
          docker push "$ACR_SERVER/smart-staffing-api:latest"

  cd-deploy:
    name: '7. CD: Deploy AKS'
    needs: [ci-qa-build, setup-env]
    # SEMPRE executa para garantir que o K8s está com os manifestos sincronizados
    if: always() && needs.ci-qa-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          resource-group: "rg-${{ secrets.PREFIX }}-prod"
          cluster-name: "${{ secrets.PREFIX }}-aks"
      - name: Deploy to AKS
        run: |
          source azure.env
          export ACR_LOGIN_SERVER=$ACR_SERVER
          
          # 1. Aplicar a Service Account Primeiro (Crucial!)
          envsubst < k8s/service-account.yaml | kubectl apply -f -
          
          # 2. Aplicar o Service
          kubectl apply -f k8s/service.yaml
          
          # 3. Aplicar o Deployment (com as variáveis substituídas)
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          
          # 4. Aplicar o HPA (Escalabilidade)
          kubectl apply -f k8s/hpa.yaml
          
          # 5. Forçar o restart para garantir que pegou as configs novas
          kubectl rollout restart deployment smart-staffing-api