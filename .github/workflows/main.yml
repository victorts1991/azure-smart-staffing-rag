name: 'Full CI/CD: Azure Smart Staffing RAG'

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: '1. Detectar Alterações'
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      search: ${{ steps.filter.outputs.search }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            k8s: ['k8s/**']
            search: ['search_assets/**', 'scripts/sync_search.py']

  terraform:
    name: '2. Infraestrutura'
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true' || github.run_number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="prefix=${{ secrets.PREFIX }}"

  deploy-functions:
    name: '3. Deploy: Azure Functions'
    needs: [terraform, changes]
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (needs.changes.outputs.terraform == 'true' || github.run_number == 1 || contains(github.event.head_commit.message, 'force-deploy'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Wait for Azure Propagation'
        run: sleep 30

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Discover Real Function Name'
        id: discover
        run: |
          RG="rg-${{ secrets.PREFIX }}-prod"
          # Captura o nome real que está na Azure agora (func-enrich-data-staffrag)
          REAL_NAME=$(az functionapp list -g $RG --query "[0].name" -o tsv)
          echo "nome_da_funcao=$REAL_NAME" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 'Deploy Function Code'
        uses: Azure/functions-action@v1
        with:
          # Usa o output do step de descoberta acima
          app-name: ${{ steps.discover.outputs.nome_da_funcao }}
          package: './azure_functions/geocoding'

  setup-env:
    name: '4. Auto-Discovery & Secrets'
    needs: [terraform]
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      acrserver: ${{ steps.get_data.outputs.acrserver }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get Resources Data
        id: get_data
        run: |
          RG="rg-${{ secrets.PREFIX }}-prod"
          
          # 1. Captura de Nomes
          SEARCH_NAME=$(az search service list -g $RG --query "[0].name" -o tsv)
          ST_NAME=$(az storage account list -g $RG --query "[0].name" -o tsv)
          OPENAI_NAME=$(az cognitiveservices account list -g $RG --query "[0].name" -o tsv)
          FUNC_NAME=$(az functionapp list -g $RG --query "[0].name" -o tsv)

          # 2. Captura de Endpoints e Chaves
          SEARCH_ENDPOINT="https://$SEARCH_NAME.search.windows.net"
          OPENAI_ENDPOINT=$(az cognitiveservices account show -n $OPENAI_NAME -g $RG --query properties.endpoint -o tsv)
          
          # O mais importante: Aspas simples para proteger a Connection String
          ST_CONN=$(az storage account show-connection-string -g $RG -n $ST_NAME --query connectionString -o tsv)
          
          FUNC_URL="https://$FUNC_NAME.azurewebsites.net/api/geocoding"
          FUNC_KEY=$(az functionapp keys list -n $FUNC_NAME -g $RG --query "masterKey" -o tsv)

          # 3. Escrita no arquivo (SEM CORTES)
          echo "SEARCH_ENDPOINT='$SEARCH_ENDPOINT'" > azure.env
          echo "AZURE_STORAGE_CONNECTION_STRING='$ST_CONN'" >> azure.env
          echo "OPENAI_ENDPOINT='$OPENAI_ENDPOINT'" >> azure.env
          echo "GEO_FUNCTION_URL='$FUNC_URL'" >> azure.env
          echo "GEO_FUNCTION_KEY='$FUNC_KEY'" >> azure.env
          
          # Dados para o ACR (Docker Build)
          ACR_NAME=$(az acr list -g $RG --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr list -g $RG --query "[0].loginServer" -o tsv)
          echo "ACR_NAME='$ACR_NAME'" >> azure.env
          echo "ACR_SERVER='$ACR_SERVER'" >> azure.env
          echo "acrserver=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Upload das Variáveis
        uses: actions/upload-artifact@v4
        with:
          name: azure-vars
          path: azure.env
          retention-days: 1

  ai-search-sync:
    name: '5. AI Search: Sync Pipeline'
    needs: [setup-env, changes, deploy-functions]
    if: needs.setup-env.result == 'success' && (needs.changes.outputs.search == 'true' || github.run_number == 1)    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Sync Search Assets
        run: |
          # Carrega as variáveis do arquivo gerado no Job 3
          set -a
          source azure.env
          set +a
          
          pip install azure-search-documents azure-identity requests
          python scripts/sync_search.py

  ci-qa-build:
    name: '6. CI: QA & Docker Build'
    needs: [setup-env]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências de Teste
        run: |
          pip install pytest pytest-asyncio httpx -r requirements.txt
          

      - name: Executar Testes Unitários
        env:
          # Variáveis fictícias apenas para o Pydantic/FastAPI inicializar nos testes
          AZURE_SEARCH_ENDPOINT: "https://dummy.search.windows.net"
          AZURE_OPENAI_ENDPOINT: "https://dummy.openai.azure.com"
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dummykey;EndpointSuffix=core.windows.net"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest app/tests/

      - name: Azure Login
        if: success() # Só loga na Azure se os testes passarem
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push
        if: success()
        run: |
          source azure.env
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_SERVER/smart-staffing-api:latest" .
          docker push "$ACR_SERVER/smart-staffing-api:latest"

  cd-deploy:
    name: '7. CD: Deploy AKS'
    needs: [ci-qa-build, setup-env]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          resource-group: "rg-${{ secrets.PREFIX }}-prod"
          cluster-name: "${{ secrets.PREFIX }}-aks"
      - name: Deploy to AKS
        run: |
          source azure.env
          export ACR_LOGIN_SERVER=$ACR_SERVER
          # Substitui variáveis no manifesto e aplica
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout restart deployment smart-staffing-api