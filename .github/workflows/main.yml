name: 'Full CI/CD: Azure Smart Staffing RAG'

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: '1. Detectar Alterações'
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      k8s: ${{ steps.filter.outputs.k8s }}
      search: ${{ steps.filter.outputs.search }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            terraform: ['terraform/**']
            search: ['search_assets/**', 'scripts/sync_search.py']

  terraform:
    name: '2. Infraestrutura'
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true' || github.run_number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="prefix=${{ secrets.PREFIX }}"

  deploy-functions:
    name: '3. Deploy: Azure Functions'
    needs: [terraform, changes]
    # SEMPRE executa, desde que o terraform não tenha falhado (pode ter sido skipped)
    if: always() && !contains(needs.terraform.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Wait for Azure Propagation'
        run: sleep 30

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Discover Real Function Name'
        id: discover
        run: |
          RG="rg-${{ secrets.PREFIX }}-prod"
          # Captura o nome real que está na Azure agora (func-enrich-data-staffrag)
          REAL_NAME=$(az functionapp list -g $RG --query "[0].name" -o tsv)
          echo "nome_da_funcao=$REAL_NAME" >> $GITHUB_OUTPUT

      - name: 'Injetar Chave do Maps na Function'
        run: |
          RG="rg-${{ secrets.PREFIX }}-prod"
          FUNC_NAME=${{ steps.discover.outputs.nome_da_funcao }}
          # Busca o nome real do recurso de Maps no RG e depois pega a chave
          MAPS_RESOURCE_NAME=$(az maps account list -g $RG --query "[0].name" -o tsv)
          MAPS_KEY=$(az maps account keys list --name "$MAPS_RESOURCE_NAME" -g $RG --query primaryKey -o tsv)
          
          az functionapp config appsettings set --name $FUNC_NAME -g $RG --settings \
            AZURE_MAPS_SUBSCRIPTION_KEY=$MAPS_KEY

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 'Zip and Deploy Function'
        run: |
          # 1. Entra na pasta onde estão os arquivos (function_app.py, etc)
          cd ./azure_functions/geocoding
          
          # 2. Cria o pacote ZIP com o conteúdo da pasta (o ponto indica a raiz)
          zip -r ../../deploy.zip .
          
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.discover.outputs.nome_da_funcao }}
          # 3. Aponta para o arquivo ZIP gerado na raiz do workspace
          package: './deploy.zip'

  setup-env:
    name: '4. Auto-Discovery & Secrets'
    needs: [terraform, deploy-functions]
    # Essencial para os jobs seguintes, roda se o terraform deu bom ou foi pulado
    if: always() && !contains(needs.terraform.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      acrserver: ${{ steps.get_data.outputs.acrserver }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: 'Wait for Services Ready'
        run: sleep 40
      
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Get Resources Data
        id: get_data
        run: |
          RG="rg-${{ secrets.PREFIX }}-prod"
          echo "Buscando recursos no RG: $RG"

          # 1. Coleta de Nomes e Endpoints
          ACR_NAME=$(az acr list -g $RG --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr list -g $RG --query "[0].loginServer" -o tsv)
          ST_NAME=$(az storage account list -g $RG --query "[0].name" -o tsv)
          ST_CONN=$(az storage account show-connection-string -g $RG -n $ST_NAME --query connectionString -o tsv)
          
          OPENAI_NAME=$(az cognitiveservices account list -g $RG --query "[0].name" -o tsv)
          OPENAI_ENDPOINT=$(az cognitiveservices account show -n $OPENAI_NAME -g $RG --query properties.endpoint -o tsv)
          OPENAI_KEY=$(az cognitiveservices account keys list -n $OPENAI_NAME -g $RG --query key1 -o tsv)
          
          MSI_ID=$(az identity list -g $RG --query "[0].clientId" -o tsv)

          # Coleta da Function (Definindo variáveis antes de usar)
          FUNC_NAME=$(az functionapp list -g $RG --query "[0].name" -o tsv)
          FUNC_KEY=$(az functionapp keys list --name $FUNC_NAME -g $RG --query "functionKeys.default" -o tsv)
          FUNC_URL="https://${FUNC_NAME}.azurewebsites.net"

          # 2. Geração do arquivo azure.env (Primeira linha usa '>', as outras '>>')
          echo "ACR_NAME='$ACR_NAME'" > azure.env
          echo "ACR_SERVER='$ACR_SERVER'" >> azure.env
          echo "ACR_LOGIN_SERVER='$ACR_SERVER'" >> azure.env
          echo "OPENAI_ENDPOINT='$OPENAI_ENDPOINT'" >> azure.env
          echo "SEARCH_ENDPOINT='https://$(az search service list -g $RG --query "[0].name" -o tsv).search.windows.net'" >> azure.env
          echo "AZURE_OPENAI_API_KEY='$OPENAI_KEY'" >> azure.env
          echo "MANAGED_IDENTITY_CLIENT_ID='$MSI_ID'" >> azure.env
          echo "AZURE_STORAGE_CONNECTION_STRING='$ST_CONN'" >> azure.env
          echo "GEO_FUNCTION_URL='$FUNC_URL'" >> azure.env
          echo "GEO_FUNCTION_KEY='$FUNC_KEY'" >> azure.env
          echo "OPENAI_API_VERSION='2024-02-01'" >> azure.env
          
          echo "acrserver=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Upload das Variáveis
        uses: actions/upload-artifact@v4
        with:
          name: azure-vars
          path: azure.env
          retention-days: 1

  ai-search-sync:
    name: '5. AI Search: Sync Pipeline'
    needs: [setup-env, changes, deploy-functions]
    if: |
      always() && 
      needs.setup-env.result == 'success' && 
      (needs.changes.outputs.search == 'true' || github.run_number == 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Sync Search Assets
        run: |
          # Carrega as variáveis do arquivo gerado no Job 3
          set -a
          source azure.env
          set +a
          
          pip install azure-search-documents azure-identity requests
          python scripts/sync_search.py

  ci-qa-build:
    name: '6. CI: QA & Docker Build'
    needs: [setup-env]
    # SEMPRE executa para garantir que a imagem no ACR está atualizada com o código
    if: always() && needs.setup-env.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências de Teste
        run: |
          pip install pytest pytest-asyncio httpx -r requirements.txt
          

      - name: Executar Testes Unitários
        env:
          # Variáveis fictícias apenas para o Pydantic/FastAPI inicializar nos testes
          AZURE_SEARCH_ENDPOINT: "https://dummy.search.windows.net"
          AZURE_OPENAI_ENDPOINT: "https://dummy.openai.azure.com"
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dummykey;EndpointSuffix=core.windows.net"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest app/tests/

      - name: Azure Login
        if: success() # Só loga na Azure se os testes passarem
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push
        if: success()
        run: |
          source azure.env
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_SERVER/smart-staffing-api:latest" .
          docker push "$ACR_SERVER/smart-staffing-api:latest"

  cd-deploy:
    name: '7. CD: Deploy AKS'
    needs: [ci-qa-build, setup-env]
    # SEMPRE executa para garantir que o K8s está com os manifestos sincronizados
    if: always() && needs.ci-qa-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download das Variáveis
        uses: actions/download-artifact@v4
        with:
          name: azure-vars
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          resource-group: "rg-${{ secrets.PREFIX }}-prod"
          cluster-name: "${{ secrets.PREFIX }}-aks"
      - name: Deploy to AKS
        run: |
          set -a
          source azure.env
          set +a
          
          export ACR_LOGIN_SERVER=$ACR_SERVER
          
          # 1. Aplicar a Service Account (Agora o envsubst vai ver o MANAGED_IDENTITY_CLIENT_ID)
          envsubst < k8s/service-account.yaml | kubectl apply -f -
          
          # 2. Aplicar o Service
          kubectl apply -f k8s/service.yaml
          
          # 3. Aplicar o Deployment
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          
          # 4. Aplicar o HPA
          kubectl apply -f k8s/hpa.yaml
          
          # 5. Reiniciar
          kubectl rollout restart deployment smart-staffing-api